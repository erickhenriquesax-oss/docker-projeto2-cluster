
version: "3.8"

services:
  nginx:
    image: nginx:latest

    ports:
      - "8080:80"

    deploy:
      replicas: 3

      placement:
        max_replicas_per_node: 1

      restart_policy:
        condition: on-failure

    volumes:
      - nginx-data:/usr/share/nginx/html

volumes:
  nginx-data:
